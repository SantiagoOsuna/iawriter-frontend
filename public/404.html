<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>IAwrite - Redirect</title>
    <script>
      const path = window.location.pathname;
      // Redirigir al index.html manteniendo la ruta para que React Router la maneje
      if (!path.includes('.')) {
        window.location.href = '/iawriter-frontend/index.html' + window.location.hash;
      }
    </script>
  </head>
  <body>
    <p>Cargando...</p>
  </body>
</html>
